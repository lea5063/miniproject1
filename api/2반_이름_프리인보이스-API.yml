openapi: 3.0.3
info:
  title: 프리인보이스 (FreeInvoice) API
  description: |
    프리랜서 견적서 발행/승인 및 인보이스 관리 서비스 API 명세서입니다.

    ## 인증 방식
    - 로그인 성공 시 JWT Access Token을 발급하며, 이후 모든 요청의 Authorization 헤더에 Bearer Token을 포함합니다.
    - role(FREELANCER / CLIENT)에 따라 접근 가능한 API가 다릅니다.

    ## 공통 규칙
    - 날짜/시간 형식: ISO 8601 (예: 2026-09-09T18:00:00)
    - 금액 필드는 소수점 둘째 자리까지의 숫자(decimal)입니다.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: 로컬 개발 서버

tags:
  - name: Auth
    description: 인증 및 회원가입
  - name: Client
    description: 프리랜서의 거래처(클라이언트) 관리
  - name: Quote
    description: 견적서 작성/발송/승인/거절
  - name: Invoice
    description: 인보이스 발행 및 결제 상태 관리

paths:
  # ==========================================
  # [Auth] 회원가입 및 로그인
  # ==========================================
  /auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입
      description: 프리랜서(FREELANCER) 또는 클라이언트(CLIENT)로 회원가입합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, role]
              properties:
                email:
                  type: string
                  format: email
                  example: freelancer@example.com
                password:
                  type: string
                  format: password
                name:
                  type: string
                  example: 김개발
                role:
                  type: string
                  enum: [FREELANCER, CLIENT]
                company_name:
                  type: string
                  description: 프리랜서는 상호(선택), 클라이언트는 소속 회사명
                  example: 프리인보이스 스튜디오
      responses:
        '201':
          description: |
            가입 완료. role이 CLIENT이고 email이 기존 clients 레코드와 일치하면
            서버가 자동으로 해당 clients.client_user_id를 연결합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 이미 존재하는 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT Access Token
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # [Client] 프리랜서 - 거래처 관리
  # ==========================================
  /clients:
    get:
      tags: [Client]
      summary: 내 거래처 목록 조회
      description: 현재 로그인한 프리랜서가 등록한 거래처 목록을 조회합니다.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Client]
      summary: 신규 거래처 등록
      description: 이메일이 이미 CLIENT로 가입되어 있다면 즉시 client_user_id가 연결됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_name, contact_name, email]
              properties:
                company_name:
                  type: string
                  example: (주)클라이언트컴퍼니
                contact_name:
                  type: string
                  example: 박담당
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  example: 010-1234-5678
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 이미 등록된 이메일의 거래처
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clients/{id}:
    put:
      tags: [Client]
      summary: 거래처 정보 수정
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name:
                  type: string
                contact_name:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Client]
      summary: 거래처 삭제
      description: 해당 거래처로 발행된 견적서/인보이스가 있으면 삭제할 수 없습니다.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 삭제 성공 (No Content)
        '400':
          description: 연결된 견적서/인보이스가 존재하여 삭제 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # [Quote] 견적서 작성/조회/발송
  # ==========================================
  /quotes:
    get:
      tags: [Quote]
      summary: 견적서 목록 조회
      description: |
        로그인한 역할에 따라 다른 목록을 반환합니다.
        - 프리랜서: 본인이 작성한 모든 견적서 (DRAFT 포함)
        - 클라이언트: 본인에게 발송된 견적서 (SENT 이상 상태만, DRAFT 제외)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DRAFT, SENT, APPROVED, REJECTED]
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Quote]
      summary: 신규 견적서 작성 (DRAFT)
      description: 견적 항목을 함께 등록하며, total_amount는 서버가 항목 합계로 자동 계산합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreateRequest'
      responses:
        '201':
          description: 작성 완료 (DRAFT 상태)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /quotes/{id}:
    get:
      tags: [Quote]
      summary: 견적서 상세 조회 (항목 포함)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Quote]
      summary: 견적서 수정
      description: DRAFT 상태에서만 수정 가능합니다. (항목 포함 전체 교체)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: DRAFT 상태가 아니어서 수정 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Quote]
      summary: 견적서 삭제
      description: DRAFT 상태에서만 삭제 가능합니다.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 삭제 성공 (No Content)
        '400':
          description: DRAFT 상태가 아니어서 삭제 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotes/{id}/send:
    post:
      tags: [Quote]
      summary: 견적서 발송
      description: DRAFT 상태의 견적서를 SENT로 변경하고 클라이언트에게 노출시킵니다.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 발송 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: DRAFT 상태가 아니어서 발송 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotes/{id}/decision:
    put:
      tags: [Quote]
      summary: 견적서 승인/거절 (클라이언트 전용)
      description: SENT 상태의 견적서에 대해서만 승인 또는 거절할 수 있습니다.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [APPROVED, REJECTED]
      responses:
        '200':
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: SENT 상태가 아니어서 처리 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # [Invoice] 인보이스 발행 및 결제 상태 관리
  # ==========================================
  /quotes/{id}/invoice:
    post:
      tags: [Invoice]
      summary: 인보이스 발행 (프리랜서 전용)
      description: APPROVED 상태의 견적서를 기반으로 인보이스를 발행합니다. 견적서당 1건만 발행 가능합니다.
      parameters:
        - name: id
          in: path
          required: true
          description: 견적서 ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [due_date]
              properties:
                due_date:
                  type: string
                  format: date
                  example: '2026-10-15'
      responses:
        '201':
          description: 발행 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          description: APPROVED 상태가 아니거나 이미 인보이스가 발행됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /invoices:
    get:
      tags: [Invoice]
      summary: 인보이스 목록 조회
      description: |
        - 프리랜서: 본인이 발행한 인보이스 전체
        - 클라이언트: 본인이 받은 인보이스 전체
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [UNPAID, PAID, OVERDUE]
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /invoices/{id}:
    get:
      tags: [Invoice]
      summary: 인보이스 상세 조회
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /invoices/{id}/status:
    put:
      tags: [Invoice]
      summary: 입금 확인 처리 (프리랜서 전용)
      description: UNPAID/OVERDUE 상태의 인보이스를 PAID로 수동 변경합니다.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PAID]
      responses:
        '200':
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [FREELANCER, CLIENT]
        company_name:
          type: string
        created_at:
          type: string
          format: date-time

    Client:
      type: object
      properties:
        id:
          type: integer
        company_name:
          type: string
        contact_name:
          type: string
        email:
          type: string
        phone:
          type: string
        is_registered:
          type: boolean
          description: client_user_id 연결 여부 (해당 이메일로 실제 가입했는지)
        created_at:
          type: string
          format: date-time

    QuoteItemInput:
      type: object
      required: [name, quantity, unit_price]
      properties:
        name:
          type: string
          example: 반응형 웹 퍼블리싱
        quantity:
          type: integer
          example: 1
        unit_price:
          type: number
          format: float
          example: 1500000

    QuoteItem:
      allOf:
        - $ref: '#/components/schemas/QuoteItemInput'
        - type: object
          properties:
            id:
              type: integer
            item_order:
              type: integer
            amount:
              type: number
              format: float
              description: quantity * unit_price

    QuoteCreateRequest:
      type: object
      required: [client_id, title, items]
      properties:
        client_id:
          type: integer
        title:
          type: string
          example: 홈페이지 리뉴얼 견적
        memo:
          type: string
        valid_until:
          type: string
          format: date
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuoteItemInput'

    QuoteSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        client_company_name:
          type: string
        status:
          type: string
          enum: [DRAFT, SENT, APPROVED, REJECTED]
        total_amount:
          type: number
          format: float
        valid_until:
          type: string
          format: date
        created_at:
          type: string
          format: date-time

    Quote:
      allOf:
        - $ref: '#/components/schemas/QuoteSummary'
        - type: object
          properties:
            freelancer_id:
              type: integer
            client_id:
              type: integer
            memo:
              type: string
            items:
              type: array
              items:
                $ref: '#/components/schemas/QuoteItem'
            sent_at:
              type: string
              format: date-time
            decided_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    Invoice:
      type: object
      properties:
        id:
          type: integer
        invoice_number:
          type: string
          example: INV-2026-0001
        quote_id:
          type: integer
        quote_title:
          type: string
        client_company_name:
          type: string
        total_amount:
          type: number
          format: float
        due_date:
          type: string
          format: date
        status:
          type: string
          enum: [UNPAID, PAID, OVERDUE]
        paid_at:
          type: string
          format: date-time
        issued_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: 필수 파라미터가 누락되었습니다.

  responses:
    BadRequest:
      description: 잘못된 요청 (필수 파라미터 누락, 유효성 검증 실패 등)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 인증 실패 (토큰 없음, 만료)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 권한 없음 (본인 소유가 아닌 리소스 접근 등)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 요청한 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
