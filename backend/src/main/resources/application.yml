server:
  port: 8080

spring:
  application:
    name: freeinvoice
  datasource:
    url: jdbc:h2:mem:freeinvoice;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: freeinvoice-mini-project-secret-key-please-change-in-production-0000
  expiration-ms: 86400000
